<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0c0a14" />
      <stop offset="50%" stopColor="#140e24" />
      <stop offset="100%" stopColor="#08060e" />
    </linearGradient>

    <!-- Heather Charcoal Fabric Body -->
    <linearGradient id="fabricHeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2c2d30" />
      <stop offset="30%" stopColor="#212225" />
      <stop offset="70%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>

    <!-- Crimson Maroon Sleeve -->
    <linearGradient id="crimsonSleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a81c1c" />
      <stop offset="45%" stopColor="#881313" />
      <stop offset="100%" stopColor="#550c0c" />
    </linearGradient>

    <!-- Collar Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#b91c1c" />
      <stop offset="100%" stopColor="#6f0e0e" />
    </linearGradient>

    <!-- Diagonal Blood / Splatter Slashes -->
    <linearGradient id="bloodSlashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#991b1b" stopOpacity="0.95" />
      <stop offset="35%" stopColor="#dc2626" stopOpacity="0.85" />
      <stop offset="70%" stopColor="#f1f5f9" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.95" />
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" floodColor="#f59e0b" floodOpacity="0.7" />
    </filter>

    <!-- Drop Shadow for Shirts -->
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodColor="#000000" floodOpacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="720" fill="url(#bgCanvas)" />

  <!-- Subtle Atmospheric Border Frame -->
  <rect x="20" y="20" width="1160" height="680" rx="24" fill="none" stroke="#334155" strokeWidth="1" strokeOpacity="0.4" />

  <!-- Header Text -->
  <g textAnchor="middle">
    <text x="600" y="62" fill="#f59e0b" fontSize="14" fontWeight="bold" letterSpacing="4" fontFamily="sans-serif">
      FSS HALLOWEEN FANCY RUN 2026 • OFFICIAL RUNNING JERSEY
    </text>
    <text x="600" y="86" fill="#94a3b8" fontSize="12" fontFamily="sans-serif">
      คณะสังคมศาสตร์ มหาวิทยาลัยนเรศวร • ลิขสิทธิ์แท้ 100%
    </text>
  </g>

  <!-- ==================== LEFT: FRONT VIEW (ด้านหน้า) ==================== -->
  <g transform="translate(130, 100)" filter="url(#shirtShadow)">
    <!-- Label Above Shirt -->
    <rect x="140" y="10" width="140" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" strokeWidth="1.5" />
    <text x="210" y="28" fill="#e0e7ff" fontSize="12" fontWeight="bold" textAnchor="middle" fontFamily="sans-serif">
      ด้านหน้า (FRONT)
    </text>

    <!-- Left Sleeve (Crimson + White Cuff) -->
    <g transform="translate(0, 40)">
      <path d="M 125,75 L 25,155 L 60,195 L 135,125 Z" fill="url(#crimsonSleeveGrad)" stroke="#3f0c0c" strokeWidth="1.5" />
      <polygon points="25,155 60,195 53,203 18,163" fill="#ffffff" />
    </g>

    <!-- Right Sleeve (Crimson + White Cuff) -->
    <g transform="translate(0, 40)">
      <path d="M 295,75 L 395,155 L 360,195 L 285,125 Z" fill="url(#crimsonSleeveGrad)" stroke="#3f0c0c" strokeWidth="1.5" />
      <polygon points="395,155 360,195 367,203 402,163" fill="#ffffff" />
    </g>

    <!-- Main Body Front -->
    <g transform="translate(0, 40)">
      <path
        d="M 125,75 
           C 165,88 255,88 295,75 
           L 320,165 
           C 315,260 325,355 330,410 
           C 255,420 165,420 90,410 
           C 95,355 105,260 100,165 Z"
        fill="url(#fabricHeather)"
        stroke="#3f3f46"
        strokeWidth="1.5"
      />

      <!-- Shadow Silhouette of King Naresuan on Right Rib -->
      <g fill="#450a0a" opacity="0.4">
        <path d="M 240,240 Q 270,180 290,260 Q 285,340 250,370 Z" />
      </g>

      <!-- Diagonal Blood / White Distressed Stripes -->
      <polygon points="95,400 205,270 230,270 120,404" fill="url(#bloodSlashGrad)" opacity="0.9" />
      <polygon points="135,406 250,270 270,270 155,410" fill="url(#bloodSlashGrad)" opacity="0.85" />
      <polygon points="175,412 285,280 300,280 190,414" fill="url(#bloodSlashGrad)" opacity="0.75" />

      <!-- Half-Zip Sport Collar -->
      <path d="M 165,82 C 180,60 240,60 255,82 L 245,102 C 230,92 190,92 175,102 Z" fill="url(#collarGrad)" stroke="#450a0a" strokeWidth="1.5" />
      <!-- Zipper Track -->
      <rect x="207" y="84" width="6" height="52" rx="1" fill="#7f1d1d" stroke="#b91c1c" strokeWidth="1" />
      <!-- Silver Zipper Puller -->
      <rect x="208.5" y="112" width="3" height="12" rx="1.5" fill="#e2e8f0" />
      <circle cx="210" cy="125" r="2.5" fill="#cbd5e1" />

      <!-- Chest Left: FSS Sacred Thai Yantra Dagger Monogram -->
      <g transform="translate(252, 115)" filter="url(#goldShine)">
        <circle cx="15" cy="8" r="2" fill="#ffffff" />
        <line x1="15" y1="10" x2="15" y2="18" stroke="#ffffff" strokeWidth="1.5" />
        <line x1="7" y1="28" x2="23" y2="28" stroke="#ffffff" strokeWidth="2" />
        <line x1="15" y1="20" x2="15" y2="48" stroke="#ffffff" strokeWidth="2" />
        <text x="15" y="37" fill="#ffffff" fontSize="11" fontWeight="bold" fontFamily="serif" textAnchor="middle">
          FSS
        </text>
      </g>

      <!-- Golden Traditional Thai Kanok Filigree Hem Border -->
      <g fill="none" stroke="#f59e0b" strokeWidth="2" filter="url(#goldShine)">
        <line x1="94" y1="402" x2="326" y2="402" stroke="#f59e0b" strokeWidth="2" />
        <!-- Corner Kanok Accents -->
        <path d="M 96,402 Q 106,386 122,395 Q 108,401 96,402" fill="#f59e0b" />
        <path d="M 324,402 Q 314,386 298,395 Q 312,401 324,402" fill="#f59e0b" />
        <!-- Center Emblem -->
        <circle cx="210" cy="398" r="4" fill="#f59e0b" />
        <path d="M 204,398 C 207,390 213,390 216,398 Z" fill="#f59e0b" />
      </g>

      <!-- Right Golden Lotus Mandala Motif -->
      <g transform="translate(295, 210)" fill="#f59e0b" opacity="0.85" filter="url(#goldShine)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#f59e0b" strokeWidth="1.5" />
        <path d="M 0,-16 C 5,-8 5,8 0,16 C -5,8 -5,-8 0,-16 Z" />
        <path d="M -16,0 C -8,5 8,5 16,0 C 8,-5 -8,-5 -16,0 Z" />
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: BACK VIEW (ด้านหลัง) ==================== -->
  <g transform="translate(650, 100)" filter="url(#shirtShadow)">
    <!-- Label Above Shirt -->
    <rect x="140" y="10" width="140" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" strokeWidth="1.5" />
    <text x="210" y="28" fill="#e0e7ff" fontSize="12" fontWeight="bold" textAnchor="middle" fontFamily="sans-serif">
      ด้านหลัง (BACK)
    </text>

    <!-- Left Sleeve Back -->
    <g transform="translate(0, 40)">
      <path d="M 125,75 L 25,155 L 60,195 L 135,125 Z" fill="url(#crimsonSleeveGrad)" stroke="#3f0c0c" strokeWidth="1.5" />
      <polygon points="25,155 60,195 53,203 18,163" fill="#ffffff" />
    </g>

    <!-- Right Sleeve Back -->
    <g transform="translate(0, 40)">
      <path d="M 295,75 L 395,155 L 360,195 L 285,125 Z" fill="url(#crimsonSleeveGrad)" stroke="#3f0c0c" strokeWidth="1.5" />
      <polygon points="395,155 360,195 367,203 402,163" fill="#ffffff" />
    </g>

    <!-- Main Body Back -->
    <g transform="translate(0, 40)">
      <path
        d="M 125,75 
           C 165,80 255,80 295,75 
           L 320,165 
           C 315,260 325,355 330,410 
           C 255,420 165,420 90,410 
           C 95,355 105,260 100,165 Z"
        fill="url(#fabricHeather)"
        stroke="#3f3f46"
        strokeWidth="1.5"
      />

      <!-- Back Collar Band -->
      <path d="M 165,76 C 185,72 235,72 255,76 L 250,90 C 230,86 190,86 170,90 Z" fill="url(#collarGrad)" stroke="#450a0a" strokeWidth="1.5" />

      <!-- Deity / Warrior Silhouette in Crimson Mist -->
      <g fill="#991b1b" opacity="0.5">
        <path d="M 270,250 Q 295,170 310,250 Q 315,310 290,360 Q 260,350 270,250 Z" />
        <polygon points="295,175 290,155 300,155" />
      </g>

      <!-- Diagonal Blood / White Distressed Stripes -->
      <polygon points="95,400 205,270 230,270 120,404" fill="url(#bloodSlashGrad)" opacity="0.9" />
      <polygon points="135,406 250,270 270,270 155,410" fill="url(#bloodSlashGrad)" opacity="0.85" />
      <polygon points="175,412 285,280 300,280 190,414" fill="url(#bloodSlashGrad)" opacity="0.75" />

      <!-- Back Typography (Faculty of Social Science / Halloween Fancy Run / 2026) -->
      <g textAnchor="middle" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.9))">
        <text x="270" y="125" fill="#f8fafc" fontSize="13" fontWeight="bold" fontFamily="serif" letterSpacing="0.5">
          Faculty of Social Science
        </text>
        <text x="270" y="145" fill="#f1f5f9" fontSize="12" fontWeight="600" fontFamily="serif">
          Halloween Fancy Run
        </text>
        <text x="270" y="180" fill="#ffffff" fontSize="26" fontWeight="900" fontFamily="sans-serif" letterSpacing="2">
          2026
        </text>
      </g>

      <!-- Golden Traditional Thai Kanok Filigree Hem Border -->
      <g fill="none" stroke="#f59e0b" strokeWidth="2" filter="url(#goldShine)">
        <line x1="94" y1="402" x2="326" y2="402" stroke="#f59e0b" strokeWidth="2" />
        <path d="M 96,402 Q 106,386 122,395 Q 108,401 96,402" fill="#f59e0b" />
        <path d="M 324,402 Q 314,386 298,395 Q 312,401 324,402" fill="#f59e0b" />
        <circle cx="210" cy="398" r="4" fill="#f59e0b" />
        <path d="M 204,398 C 207,390 213,390 216,398 Z" fill="#f59e0b" />
      </g>

      <!-- Left Rib Golden Lotus Motif -->
      <g transform="translate(125, 220)" fill="#f59e0b" opacity="0.85" filter="url(#goldShine)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#f59e0b" strokeWidth="1.5" />
        <path d="M 0,-16 C 5,-8 5,8 0,16 C -5,8 -5,-8 0,-16 Z" />
        <path d="M -16,0 C -8,5 8,5 16,0 C 8,-5 -8,-5 -16,0 Z" />
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATIONS BAR ==================== -->
  <g transform="translate(160, 620)">
    <rect x="0" y="0" width="880" height="52" rx="16" fill="#0f172a" stroke="#334155" strokeWidth="1" />
    <g fontSize="12" fontFamily="sans-serif" fill="#cbd5e1" textAnchor="middle">
      <text x="160" y="31" fill="#f59e0b" fontWeight="bold">
        🏷️ ราคาพิเศษ: 300 บาท / ตัว
      </text>
      <text x="440" y="31">
        🎽 เนื้อผ้า: Micro Dry-Tech 100% ระบายเหงื่อยอดเยี่ยม
      </text>
      <text x="730" y="31" fill="#38bdf8" fontWeight="bold">
        ✨ สกรีนกนกไทย & หมึกเรืองแสง Glow in the Dark
      </text>
    </g>
  </g>
</svg>
