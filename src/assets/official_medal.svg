<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stageBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180b1e"/>
      <stop offset="100%" stop-color="#09030c"/>
    </radialGradient>

    <!-- Acrylic Gloss Sheen -->
    <linearGradient id="acrylicGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Crimson Flame & Gold Borders -->
    <linearGradient id="crimsonFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180505"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Lanyard Pattern -->
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" rx="24" fill="url(#stageBg)"/>

  <!-- Top Title Badge -->
  <g transform="translate(450, 45)">
    <text text-anchor="middle" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" letter-spacing="4">
      FSS HALLOWEEN FANCY RUN 2026 • OFFICIAL FINISHER MEDAL
    </text>
    <text y="22" text-anchor="middle" fill="#fbbf24" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="13">
      เหรียญที่ระลึกอะคริลิกพรีเมียม (Premium UV-Printed Acrylic) พิมพ์ 2 ด้าน
    </text>
  </g>

  <!-- ==================== LEFT: FRONT SIDE (ด้านหน้า) ==================== -->
  <g transform="translate(250, 110)">
    <!-- Lanyard Ribbon -->
    <path d="M -35,-30 L -15,100 L 15,100 L 35,-30 Z" fill="url(#lanyardGrad)"/>
    <!-- Gold Clip Ring -->
    <rect x="-24" y="90" width="48" height="20" rx="6" fill="url(#goldRim)" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="0" cy="100" rx="12" ry="5" fill="#180505"/>

    <!-- Main Circular Medal with Drop Shadow -->
    <g filter="url(#shadow)" transform="translate(0, 240)">
      <!-- Outer Acrylic Edge Ring (Clear Laser-Cut Rim) -->
      <circle cx="0" cy="0" r="148" fill="#110715" stroke="url(#goldRim)" stroke-width="6"/>
      <circle cx="0" cy="0" r="142" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>

      <!-- Inner Crimson Swirl Background -->
      <circle cx="0" cy="0" r="138" fill="url(#crimsonFlame)"/>

      <!-- Flame Kranok Patterns in background -->
      <path d="M -110,-50 Q -60,-120 0,-130 Q 60,-120 110,-50 Q 130,50 60,110 Q 0,140 -80,90 Z"
            fill="#7f1d1d" opacity="0.6"/>
      
      <!-- Ghost Thai Dancer (นางรำไทย) Motif -->
      <!-- Chada Crown (ชฎาทอง) -->
      <path d="M 0,-115 L 14,-60 L 8,-50 L -8,-50 L -14,-60 Z" fill="url(#goldRim)" stroke="#451a03" stroke-width="1.5"/>
      <path d="M -22,-50 Q 0,-62 22,-50 L 18,-35 Q 0,-42 -18,-35 Z" fill="url(#goldRim)"/>
      <circle cx="0" cy="-115" r="3" fill="#fef08a"/>
      <!-- Small Chada Ear-pieces (กรรเจียกจร) -->
      <path d="M -22,-45 L -35,-35 L -22,-30 Z" fill="url(#goldRim)"/>
      <path d="M 22,-45 L 35,-35 L 22,-30 Z" fill="url(#goldRim)"/>

      <!-- Dancer Face & Pale Body -->
      <path d="M -18,-35 C -18,-50 18,-50 18,-35 C 18,-15 12,0 0,6 C -12,0 -18,-15 -18,-35 Z" fill="#f1f5f9"/>
      
      <!-- Black flowing hair -->
      <path d="M -24,-38 Q -38,10 -28,45 Q -20,20 -18,-20 Z" fill="#0f172a"/>
      <path d="M 24,-38 Q 38,10 28,45 Q 20,20 18,-20 Z" fill="#0f172a"/>

      <!-- Ghost Bleeding Eyes -->
      <ellipse cx="-7" cy="-22" rx="3.5" ry="5" fill="#ffffff" stroke="#991b1b" stroke-width="1"/>
      <ellipse cx="7" cy="-22" rx="3.5" ry="5" fill="#ffffff" stroke="#991b1b" stroke-width="1"/>
      <!-- Blood Tears dripping -->
      <path d="M -7,-17 Q -8,-5 -6,8" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 7,-17 Q 8,-5 6,8" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Red Lips & Blood Stream -->
      <path d="M -5,-7 Q 0,-3 5,-7 Q 0,-1 -5,-7 Z" fill="#991b1b"/>
      <path d="M 0,-3 L 1,12" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>

      <!-- Dancer Torso with Red Sabai (สไบแดง) & Golden Ornaments -->
      <path d="M -25,10 Q 0,2 25,10 L 32,50 L -32,50 Z" fill="#991b1b"/>
      <path d="M -25,10 L 15,50" stroke="url(#goldRim)" stroke-width="4"/>
      
      <!-- Elegant Thai Classical Dance Arms (ท่ารำจีบหงาย / ตั้งวง) -->
      <!-- Left Arm (upwards curtsy) -->
      <path d="M -25,12 C -55,-5 -75,-25 -80,-45 C -75,-48 -70,-35 -55,-15 C -45,0 -32,15 -25,18 Z" fill="#f8fafc"/>
      <!-- Left Hand Jieb -->
      <path d="M -80,-45 Q -85,-65 -78,-70 Q -72,-55 -75,-45 Z" fill="#f8fafc"/>
      <path d="M -78,-70 Q -80,-78 -75,-82" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/> <!-- Red Fingernail -->

      <!-- Right Arm (graceful side sweep) -->
      <path d="M 25,12 C 55,20 75,10 85,-5 C 75,5 55,10 25,20 Z" fill="#f8fafc"/>
      <path d="M 85,-5 Q 95,-15 90,-22 Q 82,-12 85,-5 Z" fill="#f8fafc"/>
      <path d="M 90,-22 Q 95,-28 92,-32" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

      <!-- Blood Swirl & Splatters -->
      <circle cx="-60" cy="30" r="3" fill="#ef4444"/>
      <circle cx="70" cy="40" r="2.5" fill="#ef4444"/>
      <circle cx="85" cy="-40" r="2" fill="#ef4444"/>

      <!-- FSS HALLOWEEN FANCY RUN Logo in Front -->
      <g transform="translate(0, 68)">
        <!-- Banner Outline -->
        <rect x="-105" y="-12" width="210" height="52" rx="10" fill="#0b0305" stroke="url(#goldRim)" stroke-width="2" opacity="0.95"/>
        <text y="8" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" letter-spacing="4">
          FSS
        </text>
        <text y="26" text-anchor="middle" fill="#ef4444" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="2" filter="url(#glowRed)">
          HALLOWEEN
        </text>
        <text y="36" text-anchor="middle" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" letter-spacing="3">
          ✦ FANCY RUN 2026 ✦
        </text>
      </g>

      <!-- Acrylic Gloss Reflection Highlight Overlay -->
      <path d="M -130,-50 C -70,-130 70,-130 130,-50 C 70,-90 -70,-90 -130,-50 Z" fill="url(#acrylicGlass)"/>
      <circle cx="0" cy="0" r="144" fill="url(#acrylicGlass)" opacity="0.6"/>
    </g>

    <!-- Side Label -->
    <text y="415" text-anchor="middle" fill="#ffffff" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="18">
      ด้านหน้า (Front Side)
    </text>
    <text y="435" text-anchor="middle" fill="#f87171" font-family="'IBM Plex Sans Thai', sans-serif" font-size="12">
      ผีนางรำชฎาโลหิต &amp; FSS HALLOWEEN 2026
    </text>
  </g>

  <!-- ==================== RIGHT: BACK SIDE (ด้านหลัง) ==================== -->
  <g transform="translate(650, 110)">
    <!-- Lanyard Ribbon -->
    <path d="M -35,-30 L -15,100 L 15,100 L 35,-30 Z" fill="url(#lanyardGrad)"/>
    <!-- Gold Clip Ring -->
    <rect x="-24" y="90" width="48" height="20" rx="6" fill="url(#goldRim)" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="0" cy="100" rx="12" ry="5" fill="#180505"/>

    <!-- Main Circular Medal with Drop Shadow -->
    <g filter="url(#shadow)" transform="translate(0, 240)">
      <!-- Outer Acrylic Edge Ring -->
      <circle cx="0" cy="0" r="148" fill="#110715" stroke="url(#goldRim)" stroke-width="6"/>
      <circle cx="0" cy="0" r="142" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>

      <!-- Inner Crimson Swirl Background -->
      <circle cx="0" cy="0" r="138" fill="url(#crimsonFlame)"/>

      <!-- OCTOBER 31 2026 Header with Blood Dripping -->
      <g transform="translate(0, -70)">
        <text text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" font-style="italic" letter-spacing="2">
          OCTOBER
        </text>
        <text y="26" text-anchor="middle" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" font-style="italic">
          31
        </text>
        <text y="54" text-anchor="middle" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" font-style="italic" letter-spacing="3" filter="url(#glowRed)">
          2026
        </text>
      </g>

      <!-- Twin Ghost Skulls Left and Right -->
      <!-- Left Skull -->
      <g transform="translate(-75, 5)">
        <ellipse cx="0" cy="0" rx="16" ry="19" fill="#fef3c7" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="-5" cy="0" rx="4" ry="5" fill="#1c1917"/>
        <ellipse cx="5" cy="0" rx="4" ry="5" fill="#1c1917"/>
        <path d="M 0,4 L 0,8" stroke="#1c1917" stroke-width="1.5"/>
        <path d="M -6,13 L 6,13" stroke="#1c1917" stroke-width="1.5"/>
        <!-- Ghost aura flame -->
        <circle cx="0" cy="-22" r="4" fill="#fbbf24" opacity="0.8"/>
      </g>

      <!-- Right Skull -->
      <g transform="translate(75, 5)">
        <ellipse cx="0" cy="0" rx="16" ry="19" fill="#fef3c7" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="-5" cy="0" rx="4" ry="5" fill="#1c1917"/>
        <ellipse cx="5" cy="0" rx="4" ry="5" fill="#1c1917"/>
        <path d="M 0,4 L 0,8" stroke="#1c1917" stroke-width="1.5"/>
        <path d="M -6,13 L 6,13" stroke="#1c1917" stroke-width="1.5"/>
        <circle cx="0" cy="-22" r="4" fill="#fbbf24" opacity="0.8"/>
      </g>

      <!-- Center Figure: Phantom holding Bloodied Mask -->
      <g transform="translate(0, 35)">
        <!-- Ghost Face behind mask -->
        <ellipse cx="-15" cy="-5" rx="20" ry="26" fill="#475569"/>
        <ellipse cx="-18" cy="-5" rx="4" ry="6" fill="#dc2626"/>
        <path d="M -30,-30 C -45,15 -15,40 -10,35" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>

        <!-- Bloody Mask (หน้ากากละครรำเย็บแผล) -->
        <g transform="translate(10, -5) rotate(15)">
          <ellipse cx="0" cy="0" rx="22" ry="30" fill="#fef2f2" stroke="#78350f" stroke-width="2"/>
          <!-- Mask Slit Eyes -->
          <ellipse cx="-7" cy="-7" rx="4" ry="2.5" fill="#7f1d1d"/>
          <ellipse cx="7" cy="-7" rx="4" ry="2.5" fill="#7f1d1d"/>
          <!-- Stitch Marks & Stains -->
          <path d="M 0,-15 L 0,20" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 2"/>
          <path d="M -12,5 Q 0,15 12,5" stroke="#991b1b" stroke-width="2" fill="none"/>
        </g>
      </g>

      <!-- Thai Gold Lotus Kranok Ornament Badges -->
      <circle cx="-100" cy="-60" r="6" fill="url(#goldRim)"/>
      <circle cx="100" cy="-60" r="6" fill="url(#goldRim)"/>
      <circle cx="-105" cy="50" r="5" fill="url(#goldRim)"/>
      <circle cx="105" cy="50" r="5" fill="url(#goldRim)"/>

      <!-- Lower Ribbon Banner: FACULTY OF SOCIAL SCIENCE -->
      <g transform="translate(0, 105)">
        <path d="M -115,-4 Q 0,20 115,-4 L 110,16 Q 0,38 -110,16 Z" fill="#0a0305" stroke="url(#goldRim)" stroke-width="2"/>
        <text y="14" text-anchor="middle" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" letter-spacing="3">
          FACULTY OF SOCIAL SCIENCE
        </text>
      </g>

      <!-- Acrylic Gloss Reflection Highlight Overlay -->
      <path d="M -130,-50 C -70,-130 70,-130 130,-50 C 70,-90 -70,-90 -130,-50 Z" fill="url(#acrylicGlass)"/>
      <circle cx="0" cy="0" r="144" fill="url(#acrylicGlass)" opacity="0.6"/>
    </g>

    <!-- Side Label -->
    <text y="415" text-anchor="middle" fill="#ffffff" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="18">
      ด้านหลัง (Back Side)
    </text>
    <text y="435" text-anchor="middle" fill="#fcd34d" font-family="'IBM Plex Sans Thai', sans-serif" font-size="12">
      OCTOBER 31, 2026 &amp; FACULTY OF SOCIAL SCIENCE
    </text>
  </g>
</svg>
