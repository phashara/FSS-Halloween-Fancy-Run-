<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <!-- Outer Map Border with Accent Corners -->
  <rect x="25" y="25" width="1550" height="950" rx="24" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="35" y="35" width="1530" height="930" rx="16" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Top Title Bar Inside SVG -->
  <rect x="50" y="50" width="1500" height="90" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- NU Badge / Icon -->
  <circle cx="100" cy="95" r="28" fill="#dc2626" opacity="0.2" />
  <circle cx="100" cy="95" r="20" fill="#dc2626" />
  <text x="100" y="102" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">NU</text>

  <text x="145" y="85" font-family="'Prompt', sans-serif" font-weight="800" font-size="24" fill="#ffffff">FSS HALLOWEEN FANCY RUN 2026 &middot; OFFICIAL 5.0 KM ROUTE MAP</text>
  <text x="145" y="112" font-family="'IBM Plex Sans Thai', sans-serif" font-size="14" fill="#94a3b8">เส้นทางการวิ่งทางการ ณ คณะสังคมศาสตร์ และรอบมหาวิทยาลัยนเรศวร &middot; ระยะทาง 5.0 กิโลเมตร &middot; 31 ตุลาคม 2569</text>

  <rect x="1350" y="68" width="170" height="52" rx="10" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5" />
  <text x="1435" y="100" font-family="'Prompt', sans-serif" font-weight="800" font-size="18" fill="#4ade80" text-anchor="middle">ระยะทาง 5.0 KM</text>

  <!-- Campus Campus Buildings / Campus Outline Base -->
  <!-- Stadium Block -->
  <g transform="translate(680, 200)">
    <rect width="280" height="150" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="25" y="20" width="230" height="110" rx="15" fill="#065f46" stroke="#10b981" stroke-width="2" opacity="0.6" />
    <ellipse cx="140" cy="75" rx="80" ry="35" fill="none" stroke="#a7f3d0" stroke-width="2" />
    <text x="140" y="82" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">สนามกีฬากลาง ม.นเรศวร</text>
    <rect x="85" y="125" width="110" height="24" rx="6" fill="#047857" />
    <text x="140" y="141" font-family="'Prompt', sans-serif" font-weight="700" font-size="12" fill="#ecfdf5" text-anchor="middle">KM 0.6 &middot; ผ่านด้านหน้า</text>
  </g>

  <!-- Faculty of Science Block -->
  <g transform="translate(380, 500)">
    <rect width="260" height="140" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="130" y="65" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="18" fill="#93c5fd" text-anchor="middle">คณะวิทยาศาสตร์</text>
    <text x="130" y="92" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">จุดเลี้ยวโค้งเช็กพอยต์สำคัญ</text>
    <rect x="75" y="105" width="110" height="24" rx="6" fill="#1d4ed8" />
    <text x="130" y="121" font-family="'Prompt', sans-serif" font-weight="700" font-size="12" fill="#eff6ff" text-anchor="middle">KM 2.3 &middot; จุดให้น้ำ 1</text>
  </g>

  <!-- Lake / Reservoir South -->
  <g transform="translate(320, 720)">
    <rect width="360" height="150" rx="30" fill="#0c4a6e" stroke="#0284c7" stroke-width="2" opacity="0.7" />
    <text x="180" y="75" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="20" fill="#7dd3fc" text-anchor="middle">สระน้ำ มหาวิทยาลัยนเรศวร</text>
    <text x="180" y="102" font-family="'IBM Plex Sans Thai', sans-serif" font-size="14" fill="#bae6fd" text-anchor="middle">ทัศนียภาพรอบสระน้ำ ลมพัดเย็นสบาย</text>
    <rect x="125" y="115" width="110" height="24" rx="6" fill="#0369a1" />
    <text x="180" y="131" font-family="'Prompt', sans-serif" font-weight="700" font-size="12" fill="#f0f9ff" text-anchor="middle">KM 3.0 &middot; จุดถ่ายภาพ</text>
  </g>

  <!-- Gate 4 East -->
  <g transform="translate(1180, 480)">
    <rect width="250" height="130" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="125" y="60" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="18" fill="#fcd34d" text-anchor="middle">ประตู 4 ม.นเรศวร</text>
    <text x="125" y="85" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">ทางตรงยาวฝั่งทิศตะวันออก</text>
    <rect x="70" y="95" width="110" height="24" rx="6" fill="#d97706" />
    <text x="125" y="111" font-family="'Prompt', sans-serif" font-weight="700" font-size="12" fill="#fffbeb" text-anchor="middle">KM 4.3 &middot; จุดเร่งสปีด</text>
  </g>

  <!-- START / FINISH AREA: Faculty of Social Sciences -->
  <g transform="translate(1000, 190)">
    <rect width="360" height="190" rx="20" fill="#450a0a" stroke="#ef4444" stroke-width="2.5" filter="url(#glowRed)" />
    
    <!-- Header banner -->
    <rect x="0" y="0" width="360" height="42" rx="20" fill="#dc2626" />
    <rect x="0" y="20" width="360" height="22" fill="#dc2626" />
    <text x="180" y="28" font-family="'Prompt', sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">จุดปล่อยตัว &amp; เส้นชัย 5.0 KM</text>

    <text x="180" y="75" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">คณะสังคมศาสตร์</text>
    <text x="180" y="100" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#fca5a5" text-anchor="middle">START: 18:30 น. &middot; FINISH: 20:30 น.</text>
    
    <!-- Perks inside finish zone -->
    <rect x="30" y="115" width="300" height="58" rx="10" fill="#1c1917" stroke="#7f1d1d" stroke-width="1" />
    <text x="180" y="137" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="600" font-size="12" fill="#fecaca" text-anchor="middle">🏅 มอบเหรียญ Finisher 350 ท่านแรก</text>
    <text x="180" y="157" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="600" font-size="12" fill="#fef08a" text-anchor="middle">🍲 ซุ้มอาหาร &middot; บูธของที่ระลึก &middot; ประกวดแฟนซี</text>
  </g>

  <!-- THE OFFICIAL 5.0 KM RUNNING TRACK PATH -->
  <!-- Wide Track Underlay (Dark asphalt roadway) -->
  <path d="M 1000,285 L 680,285 Q 600,285 550,340 L 450,470 Q 400,530 400,620 L 400,740 Q 400,860 520,860 L 980,860 Q 1100,860 1180,800 L 1260,650 Q 1310,550 1310,420 L 1310,340 Q 1310,285 1250,285 Z"
        fill="none" stroke="#0f172a" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M 1000,285 L 680,285 Q 600,285 550,340 L 450,470 Q 400,530 400,620 L 400,740 Q 400,860 520,860 L 980,860 Q 1100,860 1180,800 L 1260,650 Q 1310,550 1310,420 L 1310,340 Q 1310,285 1250,285 Z"
        fill="none" stroke="#334155" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vibrant Running Course Line (Multi-color gradient with glow) -->
  <path d="M 1000,285 L 680,285 Q 600,285 550,340 L 450,470 Q 400,530 400,620 L 400,740 Q 400,860 520,860 L 980,860 Q 1100,860 1180,800 L 1260,650 Q 1310,550 1310,420 L 1310,340 Q 1310,285 1250,285 Z"
        fill="none" stroke="url(#routeGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)" />

  <!-- Dash line for race flow -->
  <path d="M 1000,285 L 680,285 Q 600,285 550,340 L 450,470 Q 400,530 400,620 L 400,740 Q 400,860 520,860 L 980,860 Q 1100,860 1180,800 L 1260,650 Q 1310,550 1310,420 L 1310,340 Q 1310,285 1250,285 Z"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14" opacity="0.8" />

  <!-- Direction Arrows on Path -->
  <!-- Arrow 1 (Westbound KM 0.3) -->
  <polygon points="860,280 840,285 860,290" fill="#ffffff" />
  <!-- Arrow 2 (Southwestbound KM 1.5) -->
  <polygon points="495,405 480,420 500,425" fill="#ffffff" />
  <!-- Arrow 3 (Southbound KM 2.5) -->
  <polygon points="395,670 400,690 405,670" fill="#ffffff" />
  <!-- Arrow 4 (Eastbound KM 3.5) -->
  <polygon points="760,855 780,860 760,865" fill="#ffffff" />
  <!-- Arrow 5 (Northeastbound KM 4.2) -->
  <polygon points="1215,745 1230,730 1210,725" fill="#ffffff" />
  <!-- Arrow 6 (Northbound towards Finish) -->
  <polygon points="1305,480 1310,460 1315,480" fill="#ffffff" />

  <!-- KM MILESTONE PINS -->
  <!-- KM 1.0 -->
  <g transform="translate(510, 360)">
    <circle cx="0" cy="0" r="18" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="5" font-family="'Prompt', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">1K</text>
  </g>

  <!-- KM 2.0 -->
  <g transform="translate(400, 570)">
    <circle cx="0" cy="0" r="18" fill="#eab308" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="5" font-family="'Prompt', sans-serif" font-weight="800" font-size="12" fill="#000000" text-anchor="middle">2K</text>
  </g>

  <!-- KM 3.0 -->
  <g transform="translate(620, 860)">
    <circle cx="0" cy="0" r="18" fill="#f97316" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="5" font-family="'Prompt', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">3K</text>
  </g>

  <!-- KM 4.0 -->
  <g transform="translate(1120, 830)">
    <circle cx="0" cy="0" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="5" font-family="'Prompt', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">4K</text>
  </g>

  <!-- KM 5.0 (FINISH FLAG) -->
  <g transform="translate(1000, 285)">
    <circle cx="0" cy="0" r="24" fill="#dc2626" stroke="#ffffff" stroke-width="4" filter="url(#glowRed)" />
    <text x="0" y="6" font-family="'Prompt', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">5K</text>
  </g>

  <!-- MAP LEGEND & INFO PANEL (Bottom Left) -->
  <g transform="translate(50, 680)">
    <rect width="250" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Prompt', sans-serif" font-weight="800" font-size="16" fill="#f8fafc">สัญลักษณ์แผนที่</text>
    
    <!-- Legend Item 1: Route -->
    <line x1="20" y1="65" x2="60" y2="65" stroke="#22c55e" stroke-width="5" stroke-linecap="round" />
    <text x="75" y="70" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1">เส้นทางวิ่งทางการ 5.0 KM</text>

    <!-- Legend Item 2: Start/Finish -->
    <circle cx="40" cy="100" r="10" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="75" y="105" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1">จุดปล่อยตัว &amp; เส้นชัย (คณะสังคมฯ)</text>

    <!-- Legend Item 3: Water Station -->
    <rect x="30" y="130" width="20" height="20" rx="4" fill="#0284c7" />
    <text x="40" y="145" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">💧</text>
    <text x="75" y="145" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1">จุดบริการน้ำดื่ม (2 จุด)</text>

    <!-- Legend Item 4: First Aid -->
    <rect x="30" y="170" width="20" height="20" rx="4" fill="#dc2626" />
    <text x="40" y="185" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">+</text>
    <text x="75" y="185" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1">จุดพยาบาล &amp; รถฉุกเฉิน</text>

    <!-- Legend Item 5: Photo Point -->
    <rect x="30" y="210" width="20" height="20" rx="4" fill="#a855f7" />
    <text x="40" y="225" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">📸</text>
    <text x="75" y="225" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#cbd5e1">จุดถ่ายภาพผีแฟนซี</text>
  </g>

  <!-- Emergency & Campus Compass Rose (Bottom Right) -->
  <g transform="translate(1460, 830)">
    <circle cx="40" cy="40" r="45" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <polygon points="40,10 47,35 40,30 33,35" fill="#ef4444" />
    <polygon points="40,70 47,45 40,50 33,45" fill="#64748b" />
    <polygon points="10,40 35,33 30,40 35,47" fill="#64748b" />
    <polygon points="70,40 45,33 50,40 45,47" fill="#64748b" />
    <text x="40" y="5" font-family="'Prompt', sans-serif" font-weight="900" font-size="13" fill="#ef4444" text-anchor="middle">N</text>
    <text x="40" y="44" font-family="'Prompt', sans-serif" font-weight="800" font-size="11" fill="#94a3b8" text-anchor="middle">ม.น.</text>
  </g>
</svg>
